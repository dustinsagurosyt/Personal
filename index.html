<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Attention Reset</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Attention Reset">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<main>
  <header class="app-header"><a class="brand" href="./" aria-label="Attention Reset home"><span class="brand-mark" aria-hidden="true">◉</span> Attention Reset</a><button id="today" class="text-button">Today <span aria-hidden="true">↗</span></button></header>

  <section class="progress" aria-label="Monthly progress">
    <div class="month-heading"><h1 id="monthTitle">Your month</h1><label class="year-picker"><span class="sr-only">Year</span><select id="year" aria-label="Year"></select><span aria-hidden="true">⌄</span></label></div>
    <div class="month-navigation"><button id="previousMonth" class="arrow-button" aria-label="Previous month">‹</button><div id="monthTabs" class="month-tabs" role="tablist" aria-label="Months"></div><button id="nextMonth" class="arrow-button" aria-label="Next month">›</button></div>
    <div class="stat-line"><div class="stats" aria-label="Statistics for this month">
      <div class="stat" title="Longest run of completed days within this month"><span class="stat-value"><span id="bestStreak">0</span> <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor">
          <path d="M12 2.5c.3 4-2.7 5.5-3.2 8.4-.9-.4-1.5-1.3-1.6-2.4-1.8 1.8-3 4-3 6.3a7.8 7.8 0 0 0 15.6 0c0-4.6-3.3-9.3-7.8-12.3Z"/>
          <path d="M12.5 13c.2 1.8 2 2.8 2 4.6a2.5 2.5 0 0 1-5 0c0-1.8 1.6-3.1 3-4.6Z"/>
        </svg></span><span class="stat-label">Best streak</span></div>
      <div class="stat" title="Days with both daily goals completed"><span class="stat-value"><span id="completedDays">0</span> <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--green, #4caf50)" stroke-width="1.8">
          <rect x="5" y="5" width="14" height="14" rx="3.5"/>
        </svg></span><span class="stat-label">Days done</span></div>
      <div class="stat" title="Completed days divided by tracked calendar days through today"><span class="stat-value"><span id="completionRate">—</span> <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor">
          <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
          <path d="M7 6H3v1.5a4 4 0 0 0 4 4m10-5.5h4v1.5a4 4 0 0 1-4 4M12 14v6m-4 0h8"/>
        </svg></span><span class="stat-label">Completion</span></div>
    </div></div>

    <section class="rewards" aria-label="Rewards">
      <div class="reward-card garden-card">
        <div><h2>Garden</h2><p id="gardenCount"></p><p id="gardenPlants" hidden></p></div>
        <svg id="gardenPlant" viewBox="0 0 120 104" aria-hidden="true"></svg>
      </div>
      <div class="reward-card capsule-card">
        <svg class="capsule-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M3 8h18V5H3zm7 4h4"/></svg>
        <div><h2>Time capsule</h2><p id="capsuleProgress"></p></div>
        <button id="openCapsule" type="button" aria-expanded="false" aria-controls="capsuleReveal" hidden>Open capsule</button>
      </div>
      <div id="capsuleReveal" class="capsule-reveal" hidden>
        <div class="capsule-heading"><span id="capsuleDate"></span><button id="closeCapsule" type="button" aria-label="Close time capsule">×</button></div>
        <blockquote id="capsuleQuote"></blockquote>
        <div id="capsuleNavigation" class="capsule-navigation"><button id="olderCapsule" type="button" aria-label="Older capsule">‹</button><span id="capsulePosition"></span><button id="newerCapsule" type="button" aria-label="Newer capsule">›</button></div>
      </div>
    </section>
    <div id="calendarPanel" class="calendar-panel" role="tabpanel" aria-labelledby="monthTitle"><div class="weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div id="calendar" class="calendar" aria-label="Days in this month"></div></div>
  </section>

  <section id="dailyPanel" class="daily-panel" aria-labelledby="dayTitle">
    <div class="daily-heading"><div><h2 id="dayTitle">Today</h2></div><span id="dailyStatus" class="daily-status">0 of 2</span></div>
    <p id="futureMessage" class="muted" hidden>You can log dates in this month once they arrive.</p>
    <div class="goal-row gratitude-row"><label class="goal-label" for="gratitudeDone"><input type="checkbox" id="gratitudeDone"><span><strong id="gratitudeLabel">1-minute gratitude</strong></span></label><button id="openJournal" class="write-button">Write <span aria-hidden="true">↗</span></button></div>
    <div class="goal-row video-row"><div class="goal-label"><span id="videoMark" class="goal-mark" aria-hidden="true"></span><label for="minutes"><strong>Short videos under 60 min</strong></label></div><div class="minute-entry"><input type="number" id="minutes" min="0" max="1440" step="1" placeholder="—" inputmode="numeric" aria-label="Short-form video minutes" aria-describedby="videoFeedback"><span>min</span></div></div>
    <p id="videoFeedback" class="feedback" aria-live="polite" hidden></p>
    <p id="saved" class="save-state" role="status" aria-live="polite" hidden></p>
  </section>

  <footer><button id="export" class="text-button">Download my record ↓</button></footer>
</main>
<dialog id="journalDialog" class="journal-dialog" aria-labelledby="journalTitle">
  <div class="journal-shell">
    <div class="journal-top"><span id="journalDate" class="journal-date"></span><span class="session-badge"><i aria-hidden="true"></i><span id="sessionBadge">Gratitude</span></span><button id="closeJournal" class="close-journal" aria-label="Close journal">×</button></div>
    <h2 id="journalTitle">What am I grateful for?</h2>
    <div id="timerFace" class="timer-face"><span id="sessionIcon" class="session-icon" aria-hidden="true">🌿</span><div id="clock" class="journal-clock" role="timer" aria-label="Gratitude timer">01:00</div><span id="timerDuration" class="timer-duration">1 min</span><span class="timer-dash" aria-hidden="true"></span></div>
    <div id="writingPanel" class="writing-panel"><label class="sr-only" for="gratitudeText">What are you grateful for on this day?</label><textarea id="gratitudeText" rows="5" maxlength="10000" placeholder="Today, I’m grateful for…"></textarea><p id="journalSaved" class="journal-saved" role="status" hidden></p></div>
    <div class="journal-controls"><button id="startTimer" class="session-control" aria-label="Start timer"><span id="pauseIcon" aria-hidden="true">▶</span></button><button id="finishJournal" class="finish-journal" aria-label="Finish gratitude entry"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m11 25 9 9 19-21"/></svg></button><button id="resetTimer" class="session-control" aria-label="Reset timer"><span aria-hidden="true">↻</span></button></div>
    <p id="timerNote" class="timer-note" role="status" aria-live="polite"></p><button id="activeSession" class="text-button active-session" hidden>Return to active session</button>
  </div>
</dialog>

<script type="module" src="app.js?v=14"></script>
</body>
</html>
