<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ed">
  <title>Attention Reset</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Attention Reset">
  <link rel="stylesheet" href="style.css?v=50">
</head>
<body>
<main>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Attention Reset home"><span class="brand-mark" aria-hidden="true">◉</span> Attention Reset</a>
    <div class="header-actions">
      <button id="today" class="text-button">Today <span aria-hidden="true">↗</span></button>
      <button type="button" id="pebbleToggle" class="pebble-balance" aria-expanded="false" aria-controls="pebblePanel">
        <span id="pebbleBalance">0 pebbles</span>
      </button>
    </div>
  </header>

  <div id="homeView" class="app-view">
  <section class="progress" aria-label="Monthly progress">
    <div class="tab-heading"><h1 id="monthTitle">Your month</h1><label class="year-picker"><span class="sr-only">Year</span><select id="year" aria-label="Year"></select><span aria-hidden="true">⌄</span></label></div>
    <div class="month-navigation"><button id="previousMonth" class="arrow-button" aria-label="Previous month">‹</button><div id="monthTabs" class="month-tabs" role="tablist" aria-label="Months"></div><button id="nextMonth" class="arrow-button" aria-label="Next month">›</button></div>
    <div id="calendarPanel" class="calendar-panel" role="tabpanel" aria-labelledby="monthTitle"><div class="weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div id="calendar" class="calendar" aria-label="Days in this month"></div></div>
    <div class="stat-line"><div class="stats" aria-label="Statistics for this month">
      <div class="stat" title="Consecutive completed days through today or yesterday"><span class="stat-value"><span id="currentStreak">0</span></span><span class="stat-label">Current streak</span></div>
      <div class="stat" title="Days with both daily goals completed"><span class="stat-value"><span id="completedDays">0</span></span><span class="stat-label">Days done</span></div>
    </div></div>
  </section>

  <section id="dailyPanel" class="daily-panel" aria-labelledby="dayTitle">
    <div class="daily-heading"><div><h2 id="dayTitle">Today</h2></div></div>
    <p id="futureMessage" class="muted" hidden>You can log dates in this month once they arrive.</p>
    <div class="goal-row gratitude-row"><label class="goal-label" for="gratitudeDone"><input type="checkbox" id="gratitudeDone"><span><strong id="gratitudeLabel">1-minute gratitude</strong></span></label><button id="openJournal" class="write-button">Write <span aria-hidden="true">↗</span></button></div>
    <div class="goal-row video-row"><div class="goal-label"><span id="videoMark" class="goal-mark" aria-hidden="true"></span><label for="minutes"><strong>Short videos under 60 min</strong></label></div><div class="minute-entry"><input type="number" id="minutes" min="0" max="1440" step="1" placeholder="—" inputmode="numeric" aria-label="Short-form video minutes" aria-describedby="videoFeedback"><span>min</span></div></div>
    <p id="videoFeedback" class="feedback" aria-live="polite" hidden></p>
    <p id="saved" class="save-state" role="status" aria-live="polite" hidden></p>
  </section>

  <footer><button id="export" class="text-button">Download my record ↓</button></footer>
  </div>

  <section id="gardenView" class="app-view" aria-labelledby="gardenTitle" hidden>
    <div class="tab-heading">
      <h1 id="gardenTitle">Your garden</h1>
      <div class="garden-totals"><strong id="gardenPlants"></strong></div>
    </div>
    <p id="gardenDays" class="tab-description"></p>
    <div id="gardenPlots" class="garden-plots" aria-label="Garden plots"></div>
    <div class="next-plot" id="nextPlot" hidden>
      <svg width="32" height="34" viewBox="0 0 32 34" aria-hidden="true">
        <ellipse cx="16" cy="30" rx="12" ry="2" fill="#526946" opacity=".12"/>
        <path d="M6 17h20l-3.5 12h-13z" fill="#cc946f"/>
        <path d="M9 20h14l-.7 2H9.7z" fill="#9c674d" opacity=".36"/>
        <rect x="4" y="14" width="24" height="5" rx="2.2" fill="#cc946f"/>
        <path d="M7 15.5h18" stroke="#efd0b4" stroke-linecap="round"/>
        <path d="M11 14q5-4 10 0z" fill="#81674c"/>
        <ellipse cx="16" cy="12.6" rx="2.7" ry="1.6" transform="rotate(-28 16 12.6)" fill="#d9b583"/>
      </svg>
      <div><strong id="nextPlotTitle"></strong><p>The next completed day plants a seed.</p></div>
    </div>
  </section>

  <section id="shopView" class="app-view" aria-labelledby="shopTitle" hidden>
    <!-- Shop and rare-pet roadmap: docs/shop-roadmap.md.
         The selected illustrated preview and earlier layouts are saved in docs/previews/. -->
    <div class="tab-heading"><h1 id="shopTitle">Shop</h1></div>
    <p class="tab-description">Cosmetics, skins, and garden companions are coming.</p>
  </section>
</main>

<div id="pebblePanel" class="pebble-panel" aria-hidden="true">
  <div class="pebble-panel-copy">
    <strong id="pebbleBonus"></strong>
    <p id="pebbleCountdown"></p>
  </div>
  <div id="pebbleDots" class="pebble-dots" role="img"></div>
</div>

<nav class="app-dock" aria-label="App navigation">
  <button id="homeTab" type="button" aria-controls="homeView" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 8-7a1.5 1.5 0 0 1 2 0l8 7v9a2 2 0 0 1-2 2h-4v-6a3 3 0 0 0-6 0v6H5a2 2 0 0 1-2-2z" class="dock-icon-fill"/></svg>
    <span>Home</span>
  </button>
  <button id="gardenTab" type="button" aria-controls="gardenView" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path class="dock-icon-fill" d="M12 16C6 16 3 12 3 6c6 0 9 4 9 10ZM12 17c0-6 3-10 9-10 0 6-3 10-9 10Z"/></svg>
    <span>Garden</span>
  </button>
  <button id="shopTab" type="button" aria-controls="shopView" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="dock-icon-fill" d="M5 8h14l1 11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M9 9V6a3 3 0 1 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Shop</span>
  </button>
</nav>

<dialog id="journalDialog" class="journal-dialog" aria-labelledby="journalTitle">
  <div class="journal-shell">
    <div class="journal-top"><span id="journalDate" class="journal-date"></span><span class="session-badge"><i aria-hidden="true"></i><span id="sessionBadge">Gratitude</span></span><button id="closeJournal" class="close-journal" aria-label="Close journal">×</button></div>
    <h2 id="journalTitle">What am I grateful for?</h2>
    <div id="timerFace" class="timer-face"><span id="sessionIcon" class="session-icon" aria-hidden="true">🌿</span><div id="clock" class="journal-clock" role="timer" aria-label="Gratitude timer">01:00</div><span id="timerDuration" class="timer-duration">1 min</span><span class="timer-dash" aria-hidden="true"></span></div>
    <div id="writingPanel" class="writing-panel"><label class="sr-only" for="gratitudeText">What are you grateful for on this day?</label><textarea id="gratitudeText" rows="5" maxlength="10000" placeholder="Today, I’m grateful for…"></textarea><p id="journalSaved" class="journal-saved" role="status" hidden></p></div>
    <div class="journal-controls"><button id="startTimer" class="session-control" aria-label="Start timer"><span id="pauseIcon" aria-hidden="true">▶</span></button><button id="finishJournal" class="finish-journal" aria-label="Finish gratitude entry"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m11 25 9 9 19-21"/></svg></button><button id="resetTimer" class="session-control" aria-label="Reset timer"><span aria-hidden="true">↻</span></button></div>
    <p id="timerNote" class="timer-note" role="status" aria-live="polite"></p><button id="activeSession" class="text-button active-session" hidden>Return to active session</button>
  </div>
</dialog>

<script type="module" src="app.js?v=50"></script>
</body>
</html>
